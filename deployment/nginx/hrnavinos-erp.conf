# HRNAVINOS ERP - Nginx reverse proxy config for the Ubuntu VPS.
#
# Routes:
#   /api/  -> Gunicorn+Uvicorn (127.0.0.1:8000), whether run via systemd or Docker
#   /      -> the built frontend, served by PM2 (127.0.0.1:3000), whether run via PM2 or Docker
#
# This file is installed HTTP-only by setup_nginx.sh. Run setup_ssl.sh afterward:
# it uses `certbot --nginx`, which edits this file in place to add the HTTPS
# server block, the certificate paths, and the HTTP->HTTPS redirect.
#
# Install: deployment/scripts/setup_nginx.sh <domain>
# Replace `example.com` with the real domain before enabling.

upstream hrnavinos_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream hrnavinos_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/hrnavinos-erp.access.log;
    error_log  /var/log/nginx/hrnavinos-erp.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://hrnavinos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---------- Uploaded media (StaticFiles mount at backend root) ----------
    location /uploads/ {
        proxy_pass http://hrnavinos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend (SPA) ----------
    location / {
        proxy_pass http://hrnavinos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
