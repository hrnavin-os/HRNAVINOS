name: CI & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: ruff check .

  backend-test:
    name: Backend / Tests
    runs-on: ubuntu-latest
    # Deliberately not `needs: backend-lint`. Ruff tells you nothing about
    # whether the tests pass, so gating on it only pushed the whole run 20s
    # later. Both jobs now start at once and you see both results together.
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: hrnavinos_erp_test
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      APP_ENV: test
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        # MONGODB_URI is already set (the MongoDB service container above),
        # so conftest.py skips spinning up the embedded pymongo-inmemory
        # instance it uses for local runs and connects directly to this
        # database instead. Beanie creates indexes on app startup -- no
        # separate migration step is needed.
        #
        # -n auto splits the suite across the runner's cores. Every worker
        # talks to this same service container but gets its own database
        # (MONGODB_DB_NAME + worker id, see conftest.py) - without that they
        # would drop each other's data between tests, since the `client`
        # fixture drops the database per test. Measured against a shared
        # MongoDB: 85s serial -> 53s on 4 workers.
        #
        # Dropped -v: with parallel workers the per-test lines interleave
        # across processes and stop being readable anyway; failures still
        # print in full.
        run: pytest -n auto

  frontend-lint-build:
    name: Frontend / Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # A job here rather than its own workflow_run workflow. Chaining two
  # workflows made every push show up as two unrelated rows in the Actions
  # list, the second one titled only "Deploy to VPS #N" with no commit message,
  # and workflow_run runs never attach to the commit's checks - so a push's
  # result was split across two places and neither said the whole story.
  #
  # `needs` gates it on all three checks: a deploy is only meaningful if the
  # code that's being deployed passed. The `if` keeps it to pushes on main -
  # a pull_request event carries refs/pull/N/merge, so a PR targeting main
  # can't reach this, and develop pushes run the checks without deploying.
  deploy:
    name: Deploy to VPS
    needs: [backend-lint, backend-test, frontend-lint-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Two pushes in quick succession would otherwise run two deploys at once,
    # both doing `git reset --hard` in the same checkout on the VPS. They queue
    # instead. Not cancel-in-progress: killing a deploy midway through would
    # leave the server on a half-applied release, which is worse than waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Pulls code as its own SSH step, separate from running deploy.sh:
      # deploy.sh lives in this same repo, and `git reset --hard` rewriting
      # the script file out from under bash mid-execution (self-modifying
      # script) causes bash to read undefined/misaligned content for
      # anything after that point in the same invocation.
      - name: Pull latest code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /var/www/hrnavinos-erp
            git fetch origin main
            git reset --hard origin/main

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: bash /var/www/hrnavinos-erp/deployment/scripts/deploy.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            curl -sf https://${{ secrets.VPS_HOST }}/api/health || \
            curl -sf http://127.0.0.1:8000/api/health
