server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # In the docker-compose stack, the frontend container proxies /api/
    # to the backend service so the SPA can call a relative VITE_API_BASE_URL.
    # Not used in the VPS deployment, where the host-level Nginx (see
    # deployment/nginx/) routes /api/ directly to Gunicorn.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
