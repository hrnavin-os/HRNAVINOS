name: hrnavinos-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrnavinos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrnavinos}
      POSTGRES_DB: ${POSTGRES_DB:-hrnavinos_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrnavinos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hrnavinos}:${POSTGRES_PASSWORD:-hrnavinos}@postgres:5432/${POSTGRES_DB:-hrnavinos_erp}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/app/uploads
      - backend_logs:/app/app/logs
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile -"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:
